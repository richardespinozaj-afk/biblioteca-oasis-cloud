apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oasis-ingress
  namespace: biblioteca-oasis
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "oasis-static-ip"
    networking.gke.io/managed-certificates: "oasis-ssl-cert"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: biblioteca-oasis.tu-dominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
