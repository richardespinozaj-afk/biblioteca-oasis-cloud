spring.application.name=biblioteca-oasis

# =====================================
# CONFIGURACION BASE DE DATOS (Cloud SQL / Local)
# =====================================
spring.datasource.url=jdbc:mysql://localhost:3306/oasis?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================
# JPA / HIBERNATE
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# JWT CONFIGURACION
# =====================================
jwt.secret=bibliotecaOasisSecretKey2026IntegracionServiciosCloudGCPUTP
jwt.expiration=86400000

# =====================================
# SERVER
# =====================================
server.port=8080
server.servlet.context-path=/api

# =====================================
# CORS (se configura por codigo)
# =====================================
cors.allowed-origins=http://localhost:4200,http://localhost:3000

# =====================================
# LOGGING
# =====================================
logging.level.org.springframework.security=DEBUG
logging.level.com.biblioteca=DEBUG
